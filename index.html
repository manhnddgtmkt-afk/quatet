<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quà Tết Tâm An – Set quà Tết 2027</title>
<meta name="description" content="Set quà Tết 2027 giá sỉ. Xem ảnh, tải ảnh, đặt hàng qua Zalo.">
<meta property="og:title" content="Quà Tết Tâm An – Set quà Tết 2027">
<meta property="og:description" content="Set quà Tết 2027 giá sỉ. Xem ảnh, tải ảnh, đặt hàng qua Zalo.">
<meta property="og:image" content="img/mq1-pc1.jpg">
<meta name="theme-color" content="#8B1A1A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Khung CSS nền (quy tắc giao diện app – mục 11) */
:root{--nen:#F7EFEC;--the:#FFFFFF;--vien:#E5E7EB;--chu1:#111827;--chu2:#4B5563;--chu3:#9CA3AF;
--bam:#8B1A1A;--tet:#8B1A1A;--vang:#F3D9A4;--dong:#C9A15A;--zalo:#0068FF;--manh:#FDF3F0;--tot:#16A34A;--xau:#DC2626;--canh:#D97706;--nhapnen:#EEF4FF;
--c1:28px;--c2:16px;--c3:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--nen:#141010;--the:#1A1D23;--vien:#2A2F38;
--chu1:#F3F4F6;--chu2:#C0C5CE;--chu3:#7D8590;--bam:#F08A80;--tet:#5C1414;--vang:#EBCB8B;--dong:#B8924A;--zalo:#3B8BFF;--manh:#2A1A1A;--nhapnen:#2A1A1A}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--chu1);overflow-x:hidden;
font:400 var(--c2)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
img,video,canvas,svg{max-width:100%;display:block}
.so-chinh{font-size:var(--c1);font-weight:700;line-height:1.15}
.phu{font-size:var(--c3);color:var(--chu2)}
.mo{color:var(--chu3)}
.tien{white-space:nowrap;font-variant-numeric:tabular-nums}
.lien{white-space:nowrap}
.ten{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cau{white-space:normal;overflow-wrap:anywhere}
.the{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:14px 16px;margin:0 16px 12px}
.dong{display:flex;align-items:center;gap:12px;min-width:0}
.dong>*{min-width:0}
.dong>.tien{flex:none;margin-left:auto}
button{font:inherit;min-height:44px;border-radius:10px;cursor:pointer}
button.cau{white-space:normal}
input,select,textarea{font-size:16px;min-width:0;max-width:100%}
.hop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:50}
.hop>.khung{background:var(--the);width:100%;max-height:78dvh;overflow-y:auto;overflow-x:hidden;
touch-action:pan-y;overscroll-behavior:contain;border-radius:16px 16px 0 0;
padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.luoi-anh .o{position:relative;aspect-ratio:3/4;overflow:hidden;min-height:0}
.luoi-anh .o img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@supports not (aspect-ratio:1){.luoi-anh .o{padding-top:133%}}

/* Riêng app Quà Tết – tiền tố qt- */
.qt-wrap{max-width:720px;margin:0 auto}
.qt-dau{position:relative;overflow:hidden;background:var(--tet);background-image:radial-gradient(circle at 105% -10%,rgba(243,217,164,.22) 0 38%,transparent 38.5%),radial-gradient(circle at 95% 0%,transparent 0 46%,rgba(243,217,164,.35) 46.3% 46.8%,transparent 47%);padding:22px 16px 20px;margin-bottom:4px}
.qt-nam{margin:0 0 4px;font-size:var(--c3);color:var(--vang);letter-spacing:.3px}
.qt-dau h1{margin:0;font:700 var(--c1)/1.15 Lora,Georgia,serif;color:#fff}
.qt-dau p.phu{margin:6px 0 0;color:rgba(255,255,255,.85)}
.qt-serif{font-family:Lora,Georgia,serif}
.qt-tim{padding:12px 16px 0}
.qt-tim input{width:100%;height:46px;border:1px solid var(--vien);border-radius:10px;padding:0 14px;background:var(--the);color:var(--chu1)}
.qt-tim input::placeholder{color:var(--chu3)}
.qt-loc{position:sticky;top:0;z-index:10;background:var(--nen);padding:10px 16px 8px}
.qt-tab{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--vien);border-radius:10px;overflow:hidden;background:var(--the)}
.qt-tab button{min-height:44px;border:0;border-radius:0;background:transparent;color:var(--chu2);font-size:var(--c3);font-weight:600;padding:0 4px;white-space:nowrap}
.qt-tab button+button{border-left:1px solid var(--vien)}
.qt-tab button[aria-pressed=true]{background:var(--bam);color:#fff}
.qt-meta{margin-top:8px}
.qt-meta select{height:32px;border:1px solid var(--vien);border-radius:8px;background:var(--the);color:var(--chu1);font-size:16px;padding:0 6px}
.qt-ds{padding:4px 0 24px}
.qt-set{padding:0;overflow:hidden}
.qt-anh{position:relative;display:block;width:100%;padding:0;border:0;border-radius:0;aspect-ratio:3/2;background:var(--vien);overflow:hidden;min-height:0}
.qt-anh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@supports not (aspect-ratio:1){.qt-anh{padding-top:66.7%}}
.qt-anh .qt-dem{position:absolute;right:10px;bottom:10px;background:rgba(17,24,39,.75);color:#fff;font-size:var(--c3);padding:2px 10px;border-radius:999px}
.qt-than{padding:14px 16px 16px}
.qt-ma{flex:none;font-size:var(--c3);font-weight:700;color:#fff;background:var(--tet);border-radius:6px;padding:2px 8px}
.qt-than h2{margin:0;font:700 var(--c2)/1.3 Lora,Georgia,serif}
.qt-gia{margin-top:10px}
.qt-gia .so-chinh{color:var(--bam)}
.qt-gia .phu{margin-top:2px}
.qt-loi{color:var(--tot);font-weight:700}
.qt-ngan{border:0;border-top:1px solid var(--vien);margin:12px 0}
.qt-tp{margin:0 0 6px;font-size:var(--c2);font-weight:700}
.qt-mon{list-style:none;margin:0;padding:0}
.qt-mon li{position:relative;padding-left:16px;margin:2px 0}
.qt-mon li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--dong)}
.qt-mon li.qt-chinh{font-weight:700}
.qt-mon li.qt-chinh::before{background:var(--bam)}
.qt-goi{margin-top:8px}
.qt-nut{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.qt-nut a,.qt-nut button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;font-weight:600;font-size:var(--c2);text-decoration:none;white-space:nowrap}
.qt-phu{background:var(--the);color:var(--bam);border:1px solid var(--bam)}
.qt-chinhnut{background:var(--bam);color:#fff;border:1px solid var(--bam)}
.qt-nut .qt-chinhnut{background:var(--zalo);border-color:var(--zalo)}
.qt-trong{text-align:center;padding:32px 16px}
.qt-cuoi{text-align:center;padding:8px 16px 24px}
/* Hộp ảnh */
.qt-hd{position:sticky;top:-16px;background:var(--the);margin:-16px -16px 12px;padding:12px 8px 12px 16px;border-bottom:1px solid var(--vien);z-index:1}
.qt-hd .ten{font-weight:700}
.qt-dong-x{flex:none;margin-left:auto;width:44px;border:0;background:transparent;color:var(--chu2);font-size:24px;line-height:1}
.qt-hinh{margin:0 0 14px}
.qt-hinh img{width:100%;height:auto;border-radius:10px;background:var(--vien)}
.qt-hinh a{margin-top:8px}
.qt-taiall{width:100%}
.qt-hop-nut{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;font-weight:600;text-decoration:none}
.qt-bao{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:60;background:var(--chu1);color:var(--nen);border-radius:10px;padding:12px 14px;font-size:var(--c3);opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none;max-width:560px;margin:0 auto}
.qt-bao.on{opacity:1;transform:none}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="qt-wrap">
  <header class="qt-dau">
    <p class="qt-nam">Tết Đinh Mùi 2027</p>
    <h1>Quà Tết Tâm An</h1>
    <p class="phu">Set quà Tết giá sỉ. Chọn mẫu, xem và tải ảnh, đặt hàng qua Zalo.</p>
  </header>
  <div class="qt-tim"><input id="tim" type="search" placeholder="Tìm theo mã hoặc tên set" aria-label="Tìm theo mã hoặc tên set" autocomplete="off"></div>
  <div class="qt-loc">
    <div class="qt-tab" id="tab" role="group" aria-label="Lọc theo giá sỉ"></div>
    <div class="dong qt-meta"><span class="phu" id="dem"></span>
      <label class="phu lien" style="margin-left:auto">Xếp theo <select id="xep" aria-label="Xếp theo"><option value="ma">Mã mẫu</option><option value="tang">Giá thấp đến cao</option><option value="giam">Giá cao đến thấp</option></select></label>
    </div>
  </div>
  <main class="qt-ds" id="ds"></main>
  <footer class="qt-cuoi phu mo">Giá sỉ tính cho 1 set. Giá bán lẻ là giá gợi ý. Phiên bản 1.3, cập nhật ngày 07/11/2026.</footer>
</div>

<div class="hop" id="hopAnh" hidden role="dialog" aria-modal="true" aria-labelledby="hopTen">
  <div class="khung" id="hopKhung"></div>
</div>
<div class="qt-bao cau" id="bao" role="status"></div>

<script>
const ZALO='https://zalo.me/0986293719';
const LOC=[
  {k:'all',t:'Tất cả',f:()=>true},
  {k:'a',t:'Dưới 550k',f:p=>p<550000},
  {k:'b',t:'550k – 650k',f:p=>p>=550000&&p<=650000},
  {k:'c',t:'Trên 650k',f:p=>p>650000},
];
let DS=[],loc='all';
const $=s=>document.querySelector(s);
const vnd=n=>n.toLocaleString('vi-VN')+'đ';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const boDau=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();

function veTab(){
  $('#tab').innerHTML=LOC.map(x=>`<button type="button" data-k="${x.k}" aria-pressed="${x.k===loc}">${x.t}</button>`).join('');
}
function veDs(){
  const f=LOC.find(x=>x.k===loc).f;
  const q=boDau($('#tim').value.trim());
  let ds=DS.filter(d=>f(d.price)&&(!q||boDau(d.code+' '+d.name).includes(q)));
  const x=$('#xep').value;
  if(x==='tang')ds=[...ds].sort((a,b)=>a.price-b.price);
  if(x==='giam')ds=[...ds].sort((a,b)=>b.price-a.price);
  $('#dem').textContent=ds.length+' mẫu';
  if(!ds.length){
    $('#ds').innerHTML=`<p class="qt-trong phu cau">Không có mẫu nào khớp. Hãy xoá bớt chữ trong ô tìm hoặc chọn Tất cả.</p>`;return;
  }
  $('#ds').innerHTML=ds.map(d=>{
    const i=DS.indexOf(d),a=d.imgs[0];
    const goi=d.items.filter(t=>/^hộp/i.test(t));
    const mon=d.items.filter(t=>!goi.includes(t));
    const ruou=mon.findIndex(t=>/rượu/i.test(t));
    return `<article class="the qt-set">
  <button type="button" class="qt-anh" data-xem="${i}" aria-label="Xem ${d.imgs.length} ảnh ${esc(d.code)}">
    <img src="${a.src}" alt="${esc(d.name)} ${esc(d.code)}" loading="lazy" width="${a.w}" height="${a.h}">
    <span class="qt-dem">${d.imgs.length} ảnh</span></button>
  <div class="qt-than">
    <div class="dong"><span class="qt-ma lien">${esc(d.code)}</span><h2 class="ten">${esc(d.name)}</h2></div>
    <div class="qt-gia">
      <div class="so-chinh tien">${vnd(d.price)}</div>
      <div class="phu">Giá sỉ cho 1 set</div>
      <div class="phu cau">Bán lẻ gợi ý <span class="tien">${vnd(d.retail)}</span>, lời <span class="tien qt-loi">${vnd(d.retail-d.price)}</span> mỗi set</div>
    </div>
    <hr class="qt-ngan">
    <p class="qt-tp">Thành phần (${mon.length} món)</p>
    <ul class="qt-mon">${mon.map((t,k)=>`<li class="cau${k===ruou?' qt-chinh':''}">${esc(t)}</li>`).join('')}</ul>
    ${goi.length?`<p class="qt-goi phu cau">Đóng gói: ${esc(goi.join(', '))}</p>`:''}
    <div class="qt-nut">
      <button type="button" class="qt-phu" data-xem="${i}">Xem, tải ảnh</button>
      <a class="qt-chinhnut" href="${ZALO}" target="_blank" rel="noopener" data-dat="${i}">Đặt hàng qua Zalo</a>
    </div>
  </div>
</article>`}).join('');
}
function tenTep(d,k){return d.code.replace(/[^A-Za-z0-9]+/g,'_').replace(/_+$/,'')+'_'+(k+1)+'.jpg'}
function moAnh(i){
  const d=DS[i];
  $('#hopKhung').innerHTML=`<div class="dong qt-hd"><span class="qt-ma lien">${esc(d.code)}</span><span class="ten" id="hopTen">${esc(d.name)}</span><button type="button" class="qt-dong-x" id="dongHop" aria-label="Đóng">×</button></div>
  ${d.imgs.map((m,k)=>`<figure class="qt-hinh"><img src="${m.src}" alt="${esc(d.name)} ảnh ${k+1}" width="${m.w}" height="${m.h}" loading="lazy">
    <a class="qt-hop-nut qt-phu" href="${m.src}" download="${tenTep(d,k)}">Tải ảnh ${k+1}</a></figure>`).join('')}
  ${d.imgs.length>1?`<button type="button" class="qt-chinhnut qt-taiall" data-taiall="${i}">Tải tất cả ${d.imgs.length} ảnh</button>`:''}
  <p class="phu cau" style="margin:12px 0 0">Nếu không tải được, nhấn giữ vào ảnh rồi chọn Lưu ảnh. Khi mở trong Zalo, có thể chọn mở bằng trình duyệt để tải dễ hơn.</p>`;
  $('#hopAnh').hidden=false;document.body.style.overflow='hidden';$('#hopKhung').scrollTop=0;$('#dongHop').focus();
}
function dongAnh(){$('#hopAnh').hidden=true;document.body.style.overflow=''}
function bao(t){const e=$('#bao');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3500)}
async function chep(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-k]');if(t){loc=t.dataset.k;veTab();veDs();return}
  const x=e.target.closest('[data-xem]');if(x){moAnh(+x.dataset.xem);return}
  if(e.target.id==='dongHop'||e.target.id==='hopAnh'){dongAnh();return}
  const al=e.target.closest('[data-taiall]');if(al){const d=DS[+al.dataset.taiall];
    d.imgs.forEach((m,k)=>setTimeout(()=>{const a=document.createElement('a');a.href=m.src;a.download=tenTep(d,k);document.body.appendChild(a);a.click();a.remove()},k*700));
    bao('Đang tải '+d.imgs.length+' ảnh về máy.');return}
  const dt=e.target.closest('[data-dat]');if(dt){const d=DS[+dt.dataset.dat];
    const ok=await chep(`Quà Tết Tâm An ơi, tôi muốn đặt ${d.code} – ${d.name}, giá sỉ ${vnd(d.price)}. Số lượng: `);
    if(ok)bao('Đã chép sẵn tin nhắn đặt hàng. Trong Zalo, dán vào ô chat, ghi số lượng rồi gửi.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#hopAnh').hidden)dongAnh()});
$('#tim').addEventListener('input',veDs);
$('#xep').addEventListener('change',veDs);
fetch('data.json?v=1.3').then(r=>r.json()).then(d=>{DS=d;veTab();veDs()})
  .catch(()=>{$('#ds').innerHTML='<p class="qt-trong phu cau">Chưa tải được danh sách mẫu. Hãy kiểm tra mạng rồi tải lại trang.</p>'});
</script>
</body>
</html>
