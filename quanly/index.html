<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản trị Quà Tết Tâm An</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QL Quà Tết">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Khung CSS nền (quy tắc giao diện app – mục 11) */
:root{--nen:#F4F5F7;--the:#FFFFFF;--vien:#E5E7EB;--chu1:#111827;--chu2:#4B5563;--chu3:#9CA3AF;
--bam:#2563EB;--tot:#16A34A;--xau:#DC2626;--canh:#D97706;--nhapnen:#EEF4FF;--tet:#9B1C1C;
--totnen:#E8F6EE;--canhnen:#FFF5E6;--xaunen:#FDECEC;--bamnen:#EEF4FF;
--c1:28px;--c2:16px;--c3:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--nen:#0F1115;--the:#1A1D23;--vien:#2A2F38;
--chu1:#F3F4F6;--chu2:#C0C5CE;--chu3:#7D8590;--bam:#60A5FA;--nhapnen:#1B2638;--tet:#E07070;
--totnen:#14261C;--canhnen:#2B2112;--xaunen:#2E1717;--bamnen:#1B2638;--tot:#34C26F;--canh:#F0A43A;--xau:#F06B6B}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--chu1);overflow-x:hidden;
font:400 var(--c2)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
img,video,canvas,svg{max-width:100%;display:block}
.so-chinh{font-size:var(--c1);font-weight:700;line-height:1.15}
.phu{font-size:var(--c3);color:var(--chu2)}
.mo{color:var(--chu3)}
.tien{white-space:nowrap;font-variant-numeric:tabular-nums}
.lien{white-space:nowrap}
.ten{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cau{white-space:normal;overflow-wrap:anywhere}
.the{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:14px 16px;margin:0 16px 12px}
.dong{display:flex;align-items:center;gap:12px;min-width:0}
.dong>*{min-width:0}
.dong>.tien{flex:none;margin-left:auto}
button{font:inherit;min-height:44px;border-radius:10px;cursor:pointer}
button.cau{white-space:normal}
input,select,textarea{font-size:16px;min-width:0;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;width:100%}
.hop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:50}
.hop>.khung{background:var(--the);width:100%;max-height:78dvh;overflow-y:auto;overflow-x:hidden;
touch-action:pan-y;overscroll-behavior:contain;border-radius:16px 16px 0 0;
padding:16px 16px calc(16px + env(safe-area-inset-bottom))}

/* ---------- Thành phần riêng app quản trị (tiền tố q-) ---------- */
[hidden]{display:none!important}
.q-nut{border:1px solid var(--vien);background:var(--the);color:var(--bam);padding:0 14px;font-weight:600}
.q-nut.chinh{background:var(--bam);border-color:var(--bam);color:#fff}
.q-nut.xau{color:var(--xau)}
.q-nut.nho{min-height:36px;padding:0 10px;font-size:var(--c3)}
.q-nut:disabled{opacity:.5;cursor:default}
.q-nut-rong{width:100%}
.q-o{width:100%;border:1px solid var(--vien);border-radius:10px;padding:10px 12px;background:var(--the);color:var(--chu1);min-height:44px;font-family:inherit}
textarea.q-o{min-height:84px;resize:vertical;line-height:1.4}
.q-nhan{display:block;font-size:var(--c3);color:var(--chu2);margin:10px 0 4px}
.q-nhom{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-nhom>div{min-width:0}
.q-the{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.q-the h3{margin:0 0 8px;font-size:var(--c2)}
.q-chip{flex:none;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:var(--c3);font-weight:600;white-space:nowrap;background:var(--nen);color:var(--chu2)}
.q-chip.tot{background:var(--totnen);color:var(--tot)}.q-chip.canh{background:var(--canhnen);color:var(--canh)}
.q-chip.xau{background:var(--xaunen);color:var(--xau)}.q-chip.bam{background:var(--bamnen);color:var(--bam)}
.q-tot{color:var(--tot)}.q-canh{color:var(--canh)}.q-xau{color:var(--xau)}
.q-chon{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--vien);border-radius:10px;overflow:hidden;background:var(--the)}
.q-chon>button{border:0;border-radius:0;background:transparent;color:var(--chu2);min-height:40px;padding:0 6px;font-size:var(--c3);font-weight:600;border-left:1px solid var(--vien);white-space:nowrap}
.q-chon>button:first-child{border-left:0}
.q-chon>button.on{background:var(--bamnen);color:var(--bam)}
.q-tim{position:relative}
.q-tim input{padding-left:36px}
.q-tim svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--chu3)}
.q-dsach{background:var(--the);border:1px solid var(--vien);border-radius:14px;overflow:hidden}
.q-dong{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--vien);background:transparent;color:inherit;padding:11px 14px;min-height:60px;border-radius:0}
.q-dong:first-child{border-top:0}
.q-dong.dang{background:var(--bamnen)}
.q-dong .d1,.q-dong .d2{display:flex;align-items:center;gap:10px;min-width:0}
.q-dong .d1>*,.q-dong .d2>*{min-width:0}
.q-dong .d1 b{font-weight:600}
.q-dong .d2{margin-top:3px}
.q-dong .d1 .tien,.q-dong .d2 .tien{margin-left:auto;flex:none}
.q-trong{padding:28px 16px;text-align:center;color:var(--chu2)}
.q-viec{background:var(--canhnen);border:1px solid var(--vien);border-left:4px solid var(--canh);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.q-viec h3{margin:0 0 4px;font-size:var(--c3);color:var(--canh);text-transform:none}
.q-viec button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--chu1);padding:6px 0;min-height:36px;align-items:flex-start;border-radius:0}
.q-viec button i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--canh)}
.q-viec button i.do{background:var(--xau)}.q-viec button i.xanh{background:var(--tot)}
.q-bang{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.q-bang td{padding:5px 0;vertical-align:top}
.q-bang td:last-child{text-align:right;white-space:nowrap;padding-left:10px}
.q-bang td.phu:first-child{white-space:nowrap;padding-right:12px}
.q-bang tr.tong td{border-top:1px solid var(--vien);padding-top:8px;font-weight:700}
.q-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;background:#111827;color:#fff;border-radius:12px;padding:10px 14px;max-width:min(92vw,520px);display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.q-toast button{background:none;border:0;color:#93C5FD;font-weight:700;min-height:36px;padding:0 4px;flex:none}
.q-luu{font-size:var(--c3);color:var(--chu3);white-space:nowrap}
.q-luu.ok{color:var(--tot)}.q-luu.loi{color:var(--xau)}
.q-noi{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;border-radius:999px;box-shadow:0 6px 20px rgba(37,99,235,.35);padding:0 20px}
.q-anh{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:8px 0}
.q-anh .o{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:10px;background:var(--nen);min-height:0;border:1px solid var(--vien)}
.q-anh .o img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@supports not (aspect-ratio:1){.q-anh .o{padding-top:100%}}
.q-mau{border:1px solid var(--vien);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--the)}
.q-mau.bo{opacity:.55}
.q-mau .tp{font-size:var(--c3);color:var(--chu2);white-space:pre-line;overflow-wrap:anywhere;margin-top:4px}
.q-pa{border:1px dashed var(--vien);border-radius:10px;padding:10px;margin-top:8px;background:var(--nen)}
.q-sl{display:inline-flex;align-items:center;border:1px solid var(--vien);border-radius:10px;overflow:hidden;background:var(--the)}
.q-sl button{border:0;border-radius:0;background:transparent;color:var(--bam);width:40px;min-height:40px;font-size:20px;font-weight:700}
.q-sl input{width:64px;border:0;text-align:center;background:transparent;color:var(--chu1);min-height:40px}
.q-hang{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.q-hang>.q-nut{flex:1 1 140px}
.q-muc{font-size:var(--c3);font-weight:700;color:var(--chu2);margin:18px 0 8px;letter-spacing:.2px}
.q-muc:first-child{margin-top:0}
.q-dau{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.q-dau h2{margin:0;font-size:20px;min-width:0}
.q-dau .q-luu{margin-left:auto}
.q-ve{border:0;background:none;color:var(--bam);padding:0 6px 0 0;font-weight:600;flex:none}
.q-ghi{font-size:var(--c3);color:var(--chu2);background:var(--nen);border-radius:10px;padding:8px 10px;white-space:pre-line;overflow-wrap:anywhere}
.q-ck{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.q-ck button{border:1px solid var(--vien);background:var(--the);color:var(--chu1);min-height:56px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.q-ck button b{font-size:var(--c2)}.q-ck button span{font-size:12px;color:var(--chu2);white-space:nowrap}
.q-ck button.on{border-color:var(--bam);background:var(--bamnen)}
.q-ck button.on b{color:var(--bam)}
.q-ck button .q-canh,.q-ck button .q-xau{font-weight:600}
.q-bat{display:flex;align-items:center;gap:10px;min-height:44px}
.q-bat input{width:22px;height:22px;flex:none}

/* Màn đăng nhập */
.q-dn{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:18px}
.q-logo{width:72px;height:72px;border-radius:20px;background:var(--tet);color:#F6DFA8;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;letter-spacing:1px}
.q-dn h1{margin:0;font-size:22px;text-align:center}
.q-dn .q-the{width:100%;max-width:380px}

/* Khung app */
.q-app{min-height:100dvh}
.q-top{position:sticky;top:0;z-index:20;background:var(--nen);padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.q-top h1{margin:0;font-size:22px;min-width:0}
.q-top .phu{margin-left:auto;white-space:nowrap}
.q-lam{border:1px solid var(--vien);background:var(--the);color:var(--bam);width:40px;min-height:40px;padding:0;flex:none;display:flex;align-items:center;justify-content:center}
.q-lam svg{width:18px;height:18px}
.q-lam.quay svg{animation:q-quay 1s linear infinite}
@keyframes q-quay{to{transform:rotate(360deg)}}
.q-than{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.q-tab{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--the);border-top:1px solid var(--vien);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.q-tab button{border:0;border-radius:0;background:none;color:var(--chu3);min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600}
.q-tab button svg{width:22px;height:22px}
.q-tab button.on{color:var(--bam)}
.q-tab .ten-app{display:none}
.q-ct{position:fixed;inset:0;z-index:40;background:var(--nen);overflow-y:auto;overflow-x:hidden;padding:calc(10px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));touch-action:pan-y}
.q-luoi{display:block}
.q-ptr{position:fixed;left:50%;top:calc(6px + env(safe-area-inset-top));transform:translate(-50%,-60px);z-index:60;background:var(--the);border:1px solid var(--vien);border-radius:999px;padding:6px 14px;font-size:var(--c3);color:var(--chu2);transition:transform .15s}

@media (min-width:700px){
  .hop{align-items:center;justify-content:center}
  .hop>.khung{max-width:560px;border-radius:16px;max-height:86dvh}
}
@media (min-width:1100px){
  body{padding:0}
  .q-app{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1680px;margin:0 auto}
  .q-tab{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;align-items:stretch;border-top:0;border-right:1px solid var(--vien);padding:16px 10px;gap:4px;grid-row:1/span 2}
  .q-tab .ten-app{display:flex;align-items:center;gap:10px;font-weight:700;padding:4px 8px 16px}
  .q-tab .ten-app .q-logo{width:40px;height:40px;border-radius:12px;font-size:15px}
  .q-tab button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;min-height:44px;padding:0 12px;border-radius:10px}
  .q-tab button.on{background:var(--bamnen)}
  .q-chinh{grid-column:2;min-width:0}
  .q-top{padding:16px 24px 10px}
  .q-than{padding:0 24px 40px}
  .q-noi{position:static;box-shadow:none;border-radius:10px}
  .q-luoi.co-ct{display:grid;grid-template-columns:minmax(340px,420px) minmax(0,1fr);gap:20px;align-items:start}
  .q-ct{position:sticky;inset:auto;top:70px;z-index:auto;max-height:calc(100dvh - 86px);border:1px solid var(--vien);border-radius:16px;background:var(--the);padding:16px 18px 24px}
  .q-ct .q-the{background:var(--nen)}
  .q-ct .q-mau{background:var(--nen)}
  .q-toast{bottom:24px}
  .q-ve.chi-dt{display:none}
}
@media (hover:hover){.q-dong:hover{background:var(--nen)}.q-nut:hover:not(:disabled){filter:brightness(.97)}}
</style>
</head>
<body>
<div id="q-dn" class="q-dn" hidden></div>
<div id="q-app" class="q-app" hidden>
  <nav class="q-tab" id="q-tab"></nav>
  <main class="q-chinh">
    <header class="q-top"><h1 class="ten" id="q-tieude">Đơn hàng</h1><span class="phu" id="q-luc"></span>
      <button class="q-lam" id="q-lam" type="button" aria-label="Làm mới"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></header>
    <div class="q-than" id="q-than"></div>
  </main>
</div>
<div id="q-ptr" class="q-ptr">Kéo xuống để làm mới</div>
<div id="q-hop" class="hop" hidden><div class="khung" id="q-khung"></div></div>
<div id="q-toast" class="q-toast" hidden></div>
<script>
'use strict';
const PB='1.0';
const API='https://script.google.com/macros/s/AKfycbzPVjymGzh4kdjlRtCQ5vw89XcuJFEB3rtBv31D6tcNwUmygc4qmBKzh1jJaD7PsFQSCw/exec';
const BAN_MOI=[{b:'1.0',ds:[
 {i:'🧾',t:'Quản lý đơn hàng trên điện thoại và máy tính',m:'Tạo đơn hộ khách sỉ, hỏi kho từng mẫu, báo giá set thay, chọn chiết khấu và xem ngay lãi còn lại.',c:[['Tạo đơn','Đơn hàng → [[+ Tạo đơn]] → chọn khách sỉ → dán tin chốt Zalo hoặc chọn mẫu → [[Tạo đơn]]'],['Hỏi kho','Mở đơn → mỗi mẫu bấm [[Còn hàng]], [[Hết, có set thay]] hoặc [[Bỏ]]']]},
 {i:'👥',t:'Khách sỉ và công nợ',m:'Mỗi khách sỉ một hồ sơ: các số điện thoại, địa chỉ, thông tin hoá đơn, đơn đã mua và số tiền còn nợ.',c:[['Ghi tiền khách chuyển','Khách sỉ → chọn khách → [[Ghi tiền khách chuyển]]. Tiền tự trừ vào đơn cũ nhất chưa đủ']]},
 {i:'💰',t:'Sổ thu chi của dự án quà Tết',m:'Ghi mọi khoản tiền vào, ra: thu khách, cọc và trả kho, chi phí, trả hoa hồng. Ghi xong có 10 giây để hoàn tác.',c:[['Ghi khoản','Thu chi → [[+ Ghi khoản]]'],['Sửa hoặc huỷ','Giữ ngón tay lên khoản cần sửa → chọn [[Sửa]] hoặc [[Huỷ khoản]]']]}
]}];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soVn=n=>String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const gon=n=>Math.abs(n)>=1e6?(n<0?'−':'')+(Math.abs(n)/1e6).toFixed(Math.abs(n)>=1e8?0:Math.abs(n)>=1e7?1:2).replace('.',',').replace(/,0+$/,'')+' tr':soVn(n);
const vnd=n=>(n<0?'−':'')+soVn(Math.abs(n))+' đ';
const so=t=>{t=String(t==null?'':t);const k=/\d\s*k\s*$/i.test(t);const n=Number(t.replace(/[^0-9]/g,''))||0;return k?n*1000:n};
const ngay=t=>{if(!t)return'';const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')};
const ngayDu=t=>{if(!t)return'';const d=new Date(t);return ngay(t)+'/'+d.getFullYear()};
const gio=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const ngayO=t=>{const d=t?new Date(t):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tuNgayO=v=>{if(!v)return 0;const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,12).getTime()};
const maMoi=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},xoa(k){try{localStorage.removeItem(k)}catch(e){}}};
const ICON={
 don:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
 khach:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.6 5.2"/></svg>',
 tien:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h2"/></svg>',
 tk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"/></svg>',
 tim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
};
const TAB=[['don','Đơn hàng'],['khach','Khách sỉ'],['tien','Thu chi'],['tk','Tài khoản']];

/* ================= Máy chủ ================= */
let dangGoi=0;
async function goi(hd,du,{doc}={}){
  dangGoi++;$('#q-lam')&&$('#q-lam').classList.add('quay');
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({hd,tk:S.tk},du||{}))});
    if(!r.ok)throw new Error('Mạng chập chờn. Vui lòng thử lại.');
    const o=await r.json();
    if(!o||typeof o!=='object')throw new Error('Máy chủ trả lời không hợp lệ.');
    if(o.canDangNhap){dangXuat('Phiên đăng nhập đã hết. Vui lòng đăng nhập lại.');throw new Error(o.loi||'Vui lòng đăng nhập.')}
    if(o.canDoiPin){S.toi=Object.assign({},S.toi,{canDoiPin:true});ls.set('qtq_toi',S.toi);veDoiPin();throw new Error(o.loi)}
    if(o.dl)nhan(o.dl);
    return o;
  }catch(e){if(e instanceof TypeError)throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');throw e}
  finally{dangGoi--;if(!dangGoi&&$('#q-lam'))$('#q-lam').classList.remove('quay')}
}
function nhan(dl){
  if(!dl||!dl.ok)return;
  S.dl=dl;S.luc=Date.now();ls.set('qtq_dl',{dl,luc:S.luc});
  S.chuan={};(dl.don||[]).forEach(d=>{S.chuan[d.ma]=JSON.stringify(d)});
  if(dl.toi){S.toi=Object.assign({},S.toi,dl.toi);ls.set('qtq_toi',S.toi)}
}
async function taiLai(im){
  try{const o=await goi('tai');if(o.ok){nhan(o);ve()}else if(!im)bao(o.loi||'Chưa tải được số mới.')}
  catch(e){if(!im)bao(e.message)}
}

/* ================= Tính tiền (cùng công thức máy chủ, chỉ để xem trước) ================= */
function tinhDon(d,ch){
  const ds=(d.ct||[]).filter(l=>l.tt!=='bo'&&l.sl>0);
  const tienHang=ds.reduce((s,l)=>s+l.sl*l.gia,0),tienHangKho=ds.reduce((s,l)=>s+l.sl*(l.von||0),0);
  const tienCk=Math.round(tienHang*(Number(d.ck)||0)/100),sauCk=tienHang-tienCk;
  const tienVat=d.layHD?Math.round(sauCk*ch.vat):0;
  const tong=sauCk+tienVat+(d.phiVC||0)-(d.hoTro||0),lai=sauCk-tienHangKho-(d.hoTro||0);
  const hoaHong=d.ngt?Math.round(Math.max(0,lai)*ch.hoaHong):0;
  const coc=d.cocTay>0?d.cocTay:Math.round(Math.max(0,tong)*ch.tiLeCoc/ch.lamTronCoc)*ch.lamTronCoc;
  return {tienHang,tienCk,sauCk,tienVat,tong,lai,hoaHong,laiSauHH:lai-hoaHong,coc,tienKho:tienHangKho+tienVat,soSet:ds.reduce((s,l)=>s+l.sl,0)};
}
function giaGoiY(von){const ts=(S.dl&&S.dl.cauHinh.ts)||{moc:350000,laiSan:100000,tiLe:.3};const lai=Math.max(ts.laiSan,ts.laiSan+ts.tiLe*(von-ts.moc));return Math.round((von+lai)/10000)*10000}

function buocTiep(d,t){
  const ct=(d.ct||[]).filter(l=>l.tt!=='bo'&&l.sl>0);
  if(d.trangThai==='Mới'&&ct.length&&ct.every(l=>l.tt==='con'))return['Đã chốt','Đủ hàng – chốt đơn'];
  if(d.trangThai==='Mới'&&ct.some(l=>l.tt==='thay')&&ct.every(l=>l.tt!=='cho'))return['Chờ khách duyệt','Đã gửi báo giá – chờ khách chọn'];
  if(d.trangThai==='Chờ khách duyệt'&&ct.every(l=>l.tt==='con'))return['Đã chốt','Khách đã chọn xong – chốt đơn'];
  if(d.trangThai==='Đã chốt'&&(d.daThu||0)>=t.coc)return['Đã đặt kho','Đã đặt kho'];
  if(d.trangThai==='Đã đặt kho')return['Đang giao','Hàng đang giao'];
  if(d.trangThai==='Đang giao')return['Đã giao','Khách đã nhận hàng'];
  if(d.trangThai==='Đã giao'&&(d.daThu||0)>=t.tong)return['Hoàn tất','Đã thu đủ – hoàn tất đơn'];
  return null;
}

/* ---------- Lưu đơn: hiện ngay, ghi ngầm, lỗi thì trả lại ---------- */
function donDang(){return S.dl&&(S.dl.don||[]).find(x=>x.ma===S.moDon)}
function luuDon(ma,thay,cauOk){
  const d=(S.dl.don||[]).find(x=>x.ma===ma);if(!d)return;
  const cu=JSON.parse(JSON.stringify(d));
  // hiện ngay
  if(thay.dong)d.ct=thay.dong;
  ['trangThai','nguoiXuLy','ck','layHD','phiVC','hoTro','cocTay','ngt','ngayGiao','ghiChu'].forEach(k=>{if(thay[k]!==undefined)d[k]=thay[k]});
  if(thay.nhan)d.nhan=thay.nhan;
  Object.assign(d,tinhLaiTam(d));
  S.luu[ma]='dang';ve();
  S.hang=S.hang.then(async()=>{
    // phiên lấy từ bản máy chủ xác nhận gần nhất (lượt lưu trước có thể vừa xong)
    const goc=S.chuan&&S.chuan[ma]?JSON.parse(S.chuan[ma]):cu;
    try{const o=await goi('suaDon',{ma,thay,phien:goc.capNhat,khoa:maMoi()});
      if(!o.ok){if(o.xungDot){S.luu[ma]='';bao(o.loi)}else{khoiPhuc(ma,goc);S.luu[ma]='loi';bao('Chưa lưu được: '+(o.loi||'lỗi không rõ')+' Đã trả lại số cũ.')}ve();return}
      S.luu[ma]='ok';ve();if(cauOk)bao(cauOk);
      setTimeout(()=>{if(S.luu[ma]==='ok'){S.luu[ma]='';if(S.moDon===ma)ve()}},2500);
    }catch(e){khoiPhuc(ma,S.chuan&&S.chuan[ma]?JSON.parse(S.chuan[ma]):cu);S.luu[ma]='loi';ve();bao('Chưa lưu được: '+e.message+' Đã trả lại số cũ.')}
  });
}
function tinhLaiTam(d){const t=tinhDon(d,S.dl.cauHinh);return {tienHang:t.tienHang,tienCk:t.tienCk,tienVat:t.tienVat,tong:t.tong,lai:t.lai,hoaHong:t.hoaHong,soSet:t.soSet,conLai:t.tong-(d.daThu||0)}}
function khoiPhuc(ma,cu){const ds=S.dl.don||[],i=ds.findIndex(x=>x.ma===ma);if(i>=0)ds[i]=cu}
function dongMoi(d){return JSON.parse(JSON.stringify(d.ct||[]))}

async function taiAnhCanvas(src){return new Promise(ok=>{if(!src)return ok(null);const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ok(null);im.src=src})}
async function anhDrive(id){if(S.anhTam[id])return S.anhTam[id];try{const o=await goi('anhData',{id});if(o.ok){S.anhTam[id]=o.anh;return o.anh}}catch(e){}return null}

function vietDong(g,chu,x,y,rong,cao){const tu=String(chu).split(/\s+/);let dong='',n=0;for(const t of tu){const thu=dong?dong+' '+t:t;if(g.measureText(thu).width>rong&&dong){g.fillText(dong,x,y+n*cao);n++;dong=t}else dong=thu}if(dong){g.fillText(dong,x,y+n*cao);n++}return n*cao}
async function vePhieu(loai,o){
  const W=1080,P=64,F='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
  const c=document.createElement('canvas'),g=c.getContext('2d');c.width=W;c.height=3200;
  g.fillStyle='#FFFFFF';g.fillRect(0,0,W,c.height);
  g.fillStyle='#9B1C1C';g.fillRect(0,0,W,150);
  g.fillStyle='#F6DFA8';g.font='700 46px '+F;g.fillText(S.dl.cauHinh.thuongHieu||'Quà Tết Tâm An',P,82);
  g.font='400 28px '+F;g.fillStyle='#FCEBD0';g.fillText(o.tieuDe,P,124);
  let y=210;g.fillStyle='#111827';
  const chu=(t,co,mau,dam)=>{g.font=(dam?'700 ':'400 ')+co+'px '+F;g.fillStyle=mau||'#111827';y+=vietDong(g,t,P,y,W-2*P,co*1.35)+6};
  const hang=(trai,phai,dam,mau)=>{g.font=(dam?'700 ':'400 ')+'32px '+F;g.fillStyle=mau||'#111827';g.fillText(trai,P,y);const w=g.measureText(phai).width;g.fillText(phai,W-P-w,y);y+=50};
  const vach=()=>{g.fillStyle='#E5E7EB';g.fillRect(P,y-30,W-2*P,2);y+=12};
  if(o.khach)chu(o.khach,32,'#4B5563');
  if(o.anh&&o.anh.length){const ims=(await Promise.all(o.anh.slice(0,4).map(taiAnhCanvas))).filter(Boolean);
    if(ims.length){const n=ims.length,gap=16,w=n===1?W-2*P:(W-2*P-gap)/2;let x=P,yy=y;ims.forEach((im,k)=>{const h=n===1?Math.min(900,w*im.height/im.width):w;const s=Math.max(w/im.width,h/im.height),sw=w/s,sh=h/s;
      g.save();g.beginPath();g.rect(x,yy,w,h);g.clip();g.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,x,yy,w,h);g.restore();
      if(n===1){y=yy+h+40}else{if(k%2===0){x=P+w+gap}else{x=P;yy+=w+gap}}});if(n>1)y=yy+(n%2?w+gap:0)+40}}
  (o.dong||[]).forEach(l=>{chu(l.ten,36,'#111827',true);if(l.tp)chu(String(l.tp).split('\n').join(' · '),28,'#4B5563');hang(l.trai,l.phai,false);y+=6});
  if(o.bang){y+=10;vach();o.bang.forEach(r=>hang(r[0],r[1],r[2],r[3]))}
  if(o.qr){const im=await taiAnhCanvas(o.qr.anh);if(im){y+=10;const s=420;g.drawImage(im,(W-s)/2,y,s,s);y+=s+40;
    g.textAlign='center';g.font='700 32px '+F;g.fillStyle='#111827';g.fillText('Quét mã để chuyển '+vnd(o.qr.tien),W/2,y);y+=46;
    g.font='400 28px '+F;g.fillStyle='#4B5563';g.fillText((o.qr.nganHang||'')+' · '+(o.qr.soTk||'')+' · '+(o.qr.chuTk||''),W/2,y);y+=42;
    g.fillText('Nội dung chuyển khoản: '+o.qr.noiDung,W/2,y);y+=40;g.textAlign='left'}}
  (o.ghiChu||[]).forEach(t=>chu(t,26,'#6B7280'));
  y+=30;const out=document.createElement('canvas');out.width=W;out.height=y;out.getContext('2d').drawImage(c,0,0);
  return out;
}
async function guiAnh(canvas,ten,tinNhan){
  const blob=await new Promise(ok=>canvas.toBlob(ok,'image/png'));
  const f=new File([blob],ten+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:tinNhan||''});return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=ten+'.png';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);bao('Đã lưu ảnh '+ten+'.png về máy.');
}

function tachTin(tin){
  const mau=S.dl.mau||[],ma=new Set(mau.map(m=>m.ma.toUpperCase()));const kq=[],la=[];
  String(tin||'').split(/[\n,;]+/).forEach(doan=>{
    const re=/\b(MQ\s?\d+[A-Z]?)\b/gi;let m;const tim=[];while((m=re.exec(doan)))tim.push({ma:m[1].replace(/\s/g,'').toUpperCase(),i:m.index,j:m.index+m[0].length});
    tim.forEach((x,k)=>{const sau=doan.slice(x.j,k+1<tim.length?tim[k+1].i:undefined),truoc=doan.slice(k?tim[k-1].j:0,x.i);
      const s=(sau.match(/\d+/)||truoc.match(/(\d+)\s*(?:bộ|set|hộp|sét)?\s*$/i)||[])[0];const sl=Number(s)||0;
      if(!ma.has(x.ma)){la.push(x.ma);return}
      const co=kq.find(y=>y.ma===x.ma);if(co)co.sl+=sl||0;else kq.push({ma:x.ma,sl:sl||0})});
  });
  return {dong:kq,la};
}

        catch(er){bao(er.message)}finally{if(document.body.contains(t)){t.disabled=false;t.textContent='Tạo đơn'}}}

      if(t.id==='q-fdienkho'){doc();x.soTien=Number(t.dataset.tien)||0;veF();return}

})();
async function kiemBan(){try{const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.text()).trim();S.banMoi=v;
  if(v&&v!==PB&&!$('#q-baomoi')){const b=document.createElement('div');b.id='q-baomoi';b.className='q-toast';b.style.bottom='auto';b.style.top='calc(10px + env(safe-area-inset-top))';b.innerHTML='<span class="cau">Đã có bản '+esc(v)+' của app.</span><button type="button" data-capnhat>Cập nhật</button>';document.body.appendChild(b)}
  if(S.tab==='tk'&&S.dl&&$('#q-hop').hidden)ve()}catch(e){}}
async function capNhatBan(){try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.update().catch(()=>{})))}if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}location.replace(location.pathname+'?v='+Date.now())}

/* ================= Khởi động ================= */
(function batDau(){
  const cu=ls.get('qtq_dl');
  if(!S.tk){veDangNhap();return}
  if(S.toi&&S.toi.canDoiPin){veDoiPin();return}
  if(cu&&cu.dl){S.dl=cu.dl;S.luc=cu.luc}
  batApp();taiLai(!!cu);kiemBan();
  const da=ls.get('qtq_banxem');if(da!==PB){ls.set('qtq_banxem',PB);if(da)setTimeout(hopCoGiMoi,800)}
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
